name: HandwrittenJournal
options:
  bundleIdPrefix: com.mattvorst.education
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    TARGETED_DEVICE_FAMILY: "2"
    SWIFT_VERSION: "5.0"
    # GENERATE_INFOPLIST_FILE writes these two straight into CFBundleShortVersionString
    # and CFBundleVersion. Leave either unset and App Store Connect rejects the upload
    # with "is empty but must be composed of one to three period-separated integers".
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "7"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # v3.7: every user-facing string lives in Resources/Localizable.xcstrings; the compiler
    # extracts Text/LocalizedStringKey/String(localized:) literals into it on each build.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    # v3.3: both orientations, full screen only — a Split View or Slide Over window is
    # narrower than the page, and the page keeps its portrait width (WIREFRAME_SPEC.md §3).
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UIRequiresFullScreen: YES
targets:
  HandwrittenJournal:
    type: application
    platform: iOS
    sources:
      - path: HandwrittenJournal
        excludes: ["Resources/Voice"]
      # The voice clips are a folder reference: the app looks them up in the bundle's
      # `Voice/` subdirectory (Services/VoiceFeedback.swift). As loose files they would
      # land flat in the bundle and nothing would be found.
      - path: HandwrittenJournal/Resources/Voice
        type: folder
    # XcodeGen writes this file from `properties` on every `xcodegen generate`.
    info:
      path: HandwrittenJournal/Info.plist
      properties:
        # The app uses no non-exempt encryption.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattvorst.education.handwrittenjournal
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Handwritten Journal"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Handwritten Journal listens so you can say your sentences out loud. Your voice stays on this iPad."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Handwritten Journal turns what you say into words you can trace. Everything happens on this iPad."
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo for your profile. Photos stay on this iPad."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    scheme:
      testTargets:
        - HandwrittenJournalTests
  HandwrittenJournalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HandwrittenJournalTests
    dependencies:
      - target: HandwrittenJournal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattvorst.education.handwrittenjournal.tests
        GENERATE_INFOPLIST_FILE: YES
